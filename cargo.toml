[package]
edition = "2021"
name = "stm32g474ce_test"
version = "0.1.0"

[dependencies]
stm32g4 = { version = "0.16.0", features = ["stm32g474", "rt", "cortex-m-rt"] }
cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7.5", features = ["device"] }
panic-halt = "1.0.0"
critical-section = "1.2.0"
libm = "0.2"

[profile.release]
debug = 2